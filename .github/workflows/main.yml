name: Run Job Search Agent

on:
  schedule:
    # Запуск рівно о 11:00 за іспанським часом (09:00 UTC) щодня
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ hashFiles('jobs.db') }}
          restore-keys: |
            jobs-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-jobspy openai

      - name: Run Job Search Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
        run: python main.py
