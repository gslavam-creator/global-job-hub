name: Run Job Search Agent

on:
  schedule:
    # Запуск о 9:00 за іспанським часом (08:00 UTC) з понеділка по суботу (1-6)
    - cron: '0 8 * * 1-6'
  workflow_dispatch: # Дозволяє запускати вручну за допомогою кнопки

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ hashFiles('jobs.db') }}
          restore-keys: |
            jobs-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-jobspy openai

      - name: Run Job Search Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
        run: python main.py
